name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days of database inactivity.
# This pings the gicc-bookings REST API every 3 days so the booking backend
# never sleeps. The request runs a real query against the table (row-level
# security returns 401, which is expected — the point is that the database is
# touched). The publishable key is public by design.

on:
  schedule:
    - cron: "23 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping gicc-bookings database
        run: |
          curl -sS -o /dev/null -w "keep-alive response: HTTP %{http_code}\n" \
            "https://fpjmbsqxlzkjbgaeifdv.supabase.co/rest/v1/booking_requests?select=id&limit=1" \
            -H "apikey: sb_publishable_gJG-z0bCf5VzJ11rjuBdKg_h3_GmV5H" || true
